<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}">
    <head>
        <title layout:title-pattern="Pay My Buddy - Transfert">Transfert</title>
    </head>
    <body>
        <main layout:fragment="content">

            <div>
                <form th:action="@{/transaction}" method="post" th:object="${transaction}">
                    <div class="flex-row">
                        <select id="receiver" name="receiver" th:field="*{receiver}" required>
                            <option value="">Sélectionner une relation</option>
                            <option th:each="user : ${users}" th:value="${user.id}" th:text="${user.email}"></option>
                        </select>
                        <div th:if="${#fields.hasErrors('receiver')}" th:errors="*{receiver}"></div>
                        <input type="text" id="description" name="description" placeholder="Description" th:field="*{description}" required/>
                        <div th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                        <input type="number" step="any" min="1" id="amount" th:step="0.01" name="amount" th:field="*{amount}" placeholder="0,00 €" required/>
                        <div th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></div>
                        <button class="btn-fit btn-blue" type="submit">Payer</button>
                    </div>
                </form>

                <div th:if="${error}" style="color: red;">
                    <p th:text="${error}"></p>
                </div>
            </div>
            <div class="table">
                <table>
                    <caption>Mes Transactions</caption>
                    <thead>
                    <tr>
                        <th>Relations</th>
                        <th>Description</th>
                        <th>Montant</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Boucle Thymeleaf -->
                    <tr th:each="transaction : ${transactions}">
                        <td th:text="${transaction.receiver.username}"></td>
                        <td th:text="${transaction.description}"></td>
                        <td th:text="${transaction.amount+'€'}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </main>

    </body>
</html>
