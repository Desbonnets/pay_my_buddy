<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Inscription</title>
</head>
<body>
<h1>Inscription</h1>
    <form th:action="@{/user/new}" th:object="${user}" method="post">
        <div>
            <label for="username">nom d'utilisateur :</label>
            <input type="text" id="username" name="username" th:field="*{username}" required/>
            <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div><br><br>
        </div>
        <div>
            <label for="email">Email :</label>
            <input type="text" id="email" name="email" th:field="*{email}" required/>
            <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div><br><br>
        </div>

        <div>
            <label for="password">Mot de passe :</label>
            <input type="password" id="password" name="password" th:field="*{password}" required/>
            <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div><br><br>
        </div>

        <button type="submit">Inscription</button>
    </form>
</body>
</html>
