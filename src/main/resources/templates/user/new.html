<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Inscription</title>
        <link rel="stylesheet" th:href="@{/css/main.css}" type="text/css">
    </head>
    <body class="flex-center">
        <div class="container">
            <div class="mb-w2 mt-w1">
                <label class="btn btn-orange">Pay My Buddy</label>
            </div>
            <form th:action="@{/user/new}" th:object="${user}" method="post" role="form">
                <div>
                    <label for="username">Nom d'utilisateur :</label>
                    <input type="text" id="username" name="username" placeholder="Username" th:field="*{username}" required aria-describedby="username-error"/>
                    <div id="username-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="error" aria-live="assertive"></div>
                </div>
                <div>
                    <label for="email">Adresse email :</label>
                    <input type="text" id="email" name="email" placeholder="Mail" th:field="*{email}" required aria-describedby="email-error"/>
                    <div id="email-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error" aria-live="assertive"></div>
                </div>

                <div>
                    <label for="password">Mot de passe :</label>
                    <input type="password" id="password" name="password" placeholder="Mot de passe" th:field="*{password}" required aria-describedby="password-error"/>
                    <div id="password-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error" aria-live="assertive"></div>
                </div>

                <button class="btn btn-blue" type="submit">S'inscrire</button>
            </form>
        </div>
    </body>
</html>
