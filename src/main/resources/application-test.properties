# Informations de connexion pour la base de donn?es de test
spring.datasource.url=jdbc:mysql://localhost:3306/test_pay_my_buddy
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurations JPA/Hibernate pour les tests
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Scripts SQL pour initialiser la base de donn?es de test
spring.sql.init.schema-locations=classpath:/schema.sql
#spring.sql.init.data-locations=classpath:/db/data.sql
spring.sql.init.mode=always

# Configurations Thymeleaf pour les tests
spring.thymeleaf.enabled=true
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=true
spring.thymeleaf.mode=HTML

# Configuration des erreurs de serveur pour les tests
server.error.whitelabel.enabled=true
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-exception=true
server.error.include-stacktrace=always
